[package]
name = "nwau-core"
version = "0.1.0"
edition = "2021"
description = "Acute 2025 Rust core for the NWAU proof of concept"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/mchs"

[lib]
name = "nwau_core"
path = "src/lib.rs"

[features]
default = ["arrow-parquet"]
arrow-parquet = ["dep:arrow", "dep:parquet"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
arrow = { version = "54", default-features = false, features = ["csv", "json"], optional = true }
parquet = { version = "54", default-features = false, features = ["arrow", "snap"], optional = true }
