[package]
name = "nwau-py"
version = "0.1.0"
edition = "2021"
description = "Acute 2025 Python binding for the opt-in NWAU Rust canary"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/mchs"

[lib]
name = "nwau_py_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["abi3-py310"]
extension-module = ["pyo3/extension-module"]
abi3-py310 = ["pyo3/abi3-py310"]
abi3-py311 = ["pyo3/abi3-py311"]

[dependencies]
pyo3 = { version = "0.29.0" }
nwau-core = { path = "../nwau-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
