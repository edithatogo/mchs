GetEvidence_Screen As screen:
    Fill: =RGBA(247, 250, 247, 1)
    LoadingSpinner: =LoadingSpinner.Controls
    LoadingSpinnerColor: =RGBA(16, 94, 60, 1)
    OnVisible: =UpdateContext({locLoading: false, locStatus: "Ready", locTrace: "not run", locError: Blank()})
    ZIndex: =1

    GetEvidence_Header As groupContainer.manualLayoutContainer:
        Fill: =RGBA(8, 61, 47, 1)
        Height: =170
        LayoutMode: =LayoutMode.Manual
        Width: =Parent.Width
        ZIndex: =1

        GetEvidence_Back As icon.ArrowLeft:
            AccessibleLabel: ="Back to governed operation home"
            Color: =RGBA(255, 255, 255, 1)
            Height: =64
            Icon: =Icon.ArrowLeft
            OnSelect: =Navigate(HomeScreen_Screen)
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            TabIndex: =0
            Width: =64
            X: =24
            Y: =24
            ZIndex: =1

        GetEvidence_Eyebrow As label:
            Color: =RGBA(184, 226, 200, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =13
            Text: ="POST | NSW dylan | Synthetic data only | Connector operation"
            Width: =Parent.Width - 128
            X: =96
            Y: =24
            ZIndex: =2

        GetEvidence_Title As label:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =48
            Role: =TextRole.Heading1
            Size: =30
            Text: ="Export evidence"
            Width: =Parent.Width - 128
            X: =96
            Y: =54
            ZIndex: =3

        GetEvidence_Subtitle As label:
            Color: =RGBA(226, 240, 230, 1)
            Height: =54
            Size: =14
            Text: ="Retrieve traceable evidence bundles for governance, support, and audit review."
            Width: =Parent.Width - 128
            X: =96
            Y: =104
            ZIndex: =4

    GetEvidence_Main As groupContainer.horizontalAutoLayoutContainer:
        Fill: =RGBA(247, 250, 247, 1)
        Height: =Parent.Height - GetEvidence_Header.Height
        LayoutGap: =22
        PaddingLeft: =42
        PaddingRight: =42
        PaddingTop: =26
        Width: =Parent.Width
        Y: =GetEvidence_Header.Height
        ZIndex: =2

        GetEvidence_InputPanel As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            LayoutGap: =10
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =22
            Width: =Parent.Width * 0.38
            ZIndex: =1

            GetEvidence_PanelTitle As label:
                Color: =RGBA(30, 42, 38, 1)
                FontWeight: =FontWeight.Bold
                Height: =32
                Role: =TextRole.Heading2
                Size: =20
                Text: ="Operation inputs"
                Width: =Parent.Width - 44
                ZIndex: =1

            GetEvidence_Purpose As label:
                Color: =RGBA(83, 92, 88, 1)
                Height: =74
                Size: =13
                Text: ="Evidence export records trace IDs and provenance. It must not export patient-level or private NSW operational data."
                Width: =Parent.Width - 44
                ZIndex: =2

            GetEvidence_SyntheticWarning As label:
                Color: =RGBA(128, 86, 0, 1)
                Fill: =RGBA(255, 247, 222, 1)
                FontWeight: =FontWeight.Semibold
                Height: =64
                Size: =12
                Text: ="Synthetic data only. Do not enter patient-level data, private NSW operational data, or production identifiers."
                Width: =Parent.Width - 44
                ZIndex: =3

            GetEvidence_StateCopy As label:
                Color: =RGBA(21, 67, 120, 1)
                Fill: =RGBA(231, 242, 255, 1)
                Height: =72
                Size: =12
                Text: ="States covered: loading, success, validation error, connector error. For support, copy the trace ID or the Power Apps session ID."
                Width: =Parent.Width - 44
                ZIndex: =4

            GetEvidence_Hint As label:
                Color: =RGBA(83, 92, 88, 1)
                Height: =54
                Size: =12
                Text: ="Export only synthetic evidence until privacy and monitoring evidence is signed off."
                Width: =Parent.Width - 44
                ZIndex: =5

        GetEvidence_Body_contract_version_Label As label:
            Color: =RGBA(30, 42, 38, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="contract_version"
            Width: =Parent.Width - 44
            ZIndex: =6

        GetEvidence_Body_contract_version_TextInput As text:
            AccessibleLabel: ="contract_version"
            Default: ="2026-05"
            Height: =34
            HintText: ="Synthetic value only"
            Width: =Parent.Width - 44
            ZIndex: =7

        GetEvidence_Body_calculator_id_Label As label:
            Color: =RGBA(30, 42, 38, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="calculator_id"
            Width: =Parent.Width - 44
            ZIndex: =8

        GetEvidence_Body_calculator_id_TextInput As text:
            AccessibleLabel: ="calculator_id"
            Default: ="acute_nwau"
            Height: =34
            HintText: ="Synthetic value only"
            Width: =Parent.Width - 44
            ZIndex: =9

        GetEvidence_Body_pricing_year_Label As label:
            Color: =RGBA(30, 42, 38, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="pricing_year"
            Width: =Parent.Width - 44
            ZIndex: =10

        GetEvidence_Body_pricing_year_TextInput As text:
            AccessibleLabel: ="pricing_year"
            Default: ="2026"
            Height: =34
            HintText: ="Synthetic value only"
            Width: =Parent.Width - 44
            ZIndex: =11

        GetEvidence_Body_direction_Label As label:
            Color: =RGBA(30, 42, 38, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="direction"
            Width: =Parent.Width - 44
            ZIndex: =12

        GetEvidence_Body_direction_TextInput As text:
            AccessibleLabel: ="direction"
            Default: ="input"
            Height: =34
            HintText: ="Synthetic value only"
            Width: =Parent.Width - 44
            ZIndex: =13

        GetEvidence_Body_bundle_id_Label As label:
            Color: =RGBA(30, 42, 38, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="bundle_id"
            Width: =Parent.Width - 44
            ZIndex: =14

        GetEvidence_Body_bundle_id_TextInput As text:
            AccessibleLabel: ="bundle_id"
            Default: ="synthetic-smoke"
            Height: =34
            HintText: ="Synthetic value only"
            Width: =Parent.Width - 44
            ZIndex: =15

        GetEvidence_Body_fixture_gate_Label As label:
            Color: =RGBA(30, 42, 38, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="fixture_gate"
            Width: =Parent.Width - 44
            ZIndex: =16

        GetEvidence_Body_fixture_gate_TextInput As text:
            AccessibleLabel: ="fixture_gate"
            Default: ="synthetic-only"
            Height: =34
            HintText: ="Synthetic value only"
            Width: =Parent.Width - 44
            ZIndex: =17

        GetEvidence_Body_correlation_id_Label As label:
            Color: =RGBA(30, 42, 38, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="correlation_id"
            Width: =Parent.Width - 44
            ZIndex: =18

        GetEvidence_Body_correlation_id_TextInput As text:
            AccessibleLabel: ="correlation_id"
            Default: ="getevidence-synthetic-smoke"
            Height: =34
            HintText: ="Synthetic value only"
            Width: =Parent.Width - 44
            ZIndex: =19

            GetEvidence_RunButton As button:
                AccessibleLabel: ="Get evidence"
                DisplayMode: =If(locLoading, DisplayMode.Disabled, DisplayMode.Edit)
                Fill: =RGBA(16, 94, 60, 1)
                Height: =46
                OnSelect: |-
                    =UpdateContext({locLoading: true, locStatus: "Requesting evidence bundle", locTrace: GetEvidence_Body_correlation_id_TextInput.Text, locError: Blank()});
                    IfError(
                        ClearCollect(GetEvidence, MCHSServiceBoundary.GetEvidence({contract_version: GetEvidence_Body_contract_version_TextInput.Text, calculator_id: GetEvidence_Body_calculator_id_TextInput.Text, pricing_year: GetEvidence_Body_pricing_year_TextInput.Text, direction: GetEvidence_Body_direction_TextInput.Text, bundle_id: GetEvidence_Body_bundle_id_TextInput.Text, fixture_gate: GetEvidence_Body_fixture_gate_TextInput.Text, correlation_id: GetEvidence_Body_correlation_id_TextInput.Text, input_payload: {}})),
                        UpdateContext({locLoading: false, locStatus: "Evidence connector error", locError: FirstError.Message, locTrace: "copy the Power Apps session ID"});
                        Notify(FirstError.Message, NotificationType.Error, 5000),
                        UpdateContext({locLoading: false, locStatus: "Evidence response returned", locError: Blank(), locTrace: Coalesce(First(GetEvidence).trace_id, GetEvidence_Body_correlation_id_TextInput.Text)});
                        Notify("Evidence response", NotificationType.Success, 5000)
                    );
                Size: =14
                Text: =If(locLoading, "Running...", "Get evidence")
                Width: =Parent.Width - 44
                ZIndex: =40

        GetEvidence_ResultPanel As groupContainer.verticalAutoLayoutContainer:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 52
            LayoutGap: =12
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =22
            Width: =Parent.Width * 0.52
            ZIndex: =2

            GetEvidence_ResultTitle As label:
                Color: =RGBA(30, 42, 38, 1)
                FontWeight: =FontWeight.Bold
                Height: =32
                Role: =TextRole.Heading2
                Size: =20
                Text: ="Result and trace"
                Width: =Parent.Width - 44
                ZIndex: =1

            GetEvidence_Status As label:
                Color: =If(locError = Blank(), RGBA(16, 94, 60, 1), RGBA(164, 38, 44, 1))
                Fill: =If(locError = Blank(), RGBA(232, 246, 236, 1), RGBA(255, 235, 238, 1))
                FontWeight: =FontWeight.Semibold
                Height: =44
                Size: =14
                Text: ="Status: " & locStatus
                Width: =Parent.Width - 44
                ZIndex: =2

            GetEvidence_Trace As label:
                Color: =RGBA(21, 67, 120, 1)
                Fill: =RGBA(231, 242, 255, 1)
                Height: =44
                Size: =13
                Text: ="Trace ID: " & locTrace
                Width: =Parent.Width - 44
                ZIndex: =3

            GetEvidence_Error As label:
                Color: =RGBA(164, 38, 44, 1)
                Fill: =RGBA(255, 235, 238, 1)
                Height: =54
                Size: =12
                Text: =If(locError = Blank(), "No connector error recorded.", "Connector error: " & locError)
                Width: =Parent.Width - 44
                ZIndex: =4

            GetEvidence_DataTable As dataTable.datatable:
                Fill: =RGBA(0, 0, 0, 0)
                Height: =Parent.Height - 220
                Items: =GetEvidence
                Size: =13
                Width: =Parent.Width - 44
                ZIndex: =5

                GetEvidence_Status_Column As dataTableColumn.textualColumn:
                    FieldDisplayName: ="status"
                    FieldName: ="status"
                    FieldVariantName: ="textualColumn"
                    Order: =1
                    Text: =ThisItem.status
                    Width: =140
                    ZIndex: =1

                GetEvidence_Trace_Column As dataTableColumn.textualColumn:
                    FieldDisplayName: ="trace_id"
                    FieldName: ="trace_id"
                    FieldVariantName: ="textualColumn"
                    Order: =2
                    Text: =ThisItem.trace_id
                    Width: =180
                    ZIndex: =2

                GetEvidence_Result_Column As dataTableColumn.textualColumn:
                    FieldDisplayName: ="result_payload"
                    FieldName: ="result_payload"
                    FieldVariantName: ="textualColumn"
                    IsHyperlink: =true
                    OnSelect: =Navigate(DynamicContentScreen_Screen, ScreenTransition.None, {DisplayText: JSON(Parent.Selected.result_payload, IndentFour), HeaderTitle: "result_payload"})
                    Order: =3
                    Text: =Text("result_payload")
                    Width: =180
                    ZIndex: =3
