ValidateInput_Screen As screen:
    ZIndex: =1

    ValidateInput_Button As button:
        DisplayMode: =DisplayMode.Edit
        FocusedBorderThickness: =2
        Font: =Font.'Segoe UI'
        Height: =40
        OnSelect: |-
            =IfError(
                ClearCollect(ValidateInput, MCHSServiceBoundary.ValidateInput({contract_version: ValidateInput_Body_contract_version_TextInput.Text,calculator_id: ValidateInput_Body_calculator_id_TextInput.Text,pricing_year: ValidateInput_Body_pricing_year_TextInput.Text,direction: ValidateInput_Body_direction_TextInput.Text,bundle_id: ValidateInput_Body_bundle_id_TextInput.Text,fixture_gate: ValidateInput_Body_fixture_gate_TextInput.Text,correlation_id: ValidateInput_Body_correlation_id_TextInput.Text,input_payload: {}})),
                Notify(
                    FirstError.Message,
                    NotificationType.Error,
                    5000
                );
            	
                false,
                Notify(
                    "Validation response",
                    NotificationType.Success,
                    5000
                );
            );
        Size: =14
        Text: ="POST"
        Width: =150
        X: =ValidateInput_VerticalContainer.X
        Y: =Parent.Height - (ValidateInput_Button.Height + 20)
        ZIndex: =1

    ValidateInput_OK_DataTable As dataTable.datatable:
        Fill: =RGBA(0, 0, 0, 0)
        Font: =Font.'Segoe UI'
        Height: =(Parent.Height - ValidateInput_OK_DataTable.Y) - 20
        Items: =ValidateInput
        Size: =14
        Width: =Parent.Width - ValidateInput_OK_DataTable.X - 10
        X: =ValidateInput_VerticalContainer.Width + 30
        Y: =ValidateInput_Header_ManualContainer.Y + ValidateInput_Header_ManualContainer.Height + 40
        ZIndex: =2

        ValidateInput_OK_provenance_DataTableColumn As dataTableColumn.textualColumn:
            FieldDisplayName: ="provenance"
            FieldName: ="provenance"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            IsHyperlink: =true
            OnSelect: |-
                =Navigate(DynamicContentScreen_Screen, ScreenTransition.None, {DisplayText: JSON(Parent.Selected.provenance, IndentFour), HeaderTitle: "provenance"})
            Order: =6
            Text: =Text("provenance")
            Width: =100
            X: =0
            Y: =0
            ZIndex: =1

        ValidateInput_OK_diagnostics_DataTableColumn As dataTableColumn.textualColumn:
            FieldDisplayName: ="diagnostics"
            FieldName: ="diagnostics"
            FieldVariantName: ="textualColumn"
