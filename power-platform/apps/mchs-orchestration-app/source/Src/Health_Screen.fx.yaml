Health_Screen As screen:
    ZIndex: =1

    Health_Button As button:
        DisplayMode: =DisplayMode.Edit
        FocusedBorderThickness: =2
        Font: =Font.'Segoe UI'
        Height: =40
        OnSelect: |-
            =IfError(
                MCHSServiceBoundary.Health(),
                Notify(
                    FirstError.Message,
                    NotificationType.Error,
                    5000
                );
            	
                false,
                Notify(
                    "Service is running",
                    NotificationType.Success,
                    5000
                );
            );
        Size: =14
        Text: ="GET"
        Width: =150
        X: =(Parent.Width - Health_Button.Width) / 2
        Y: =Parent.Height - (Health_Button.Height + 20)
        ZIndex: =1

    Health_Header_ManualContainer As groupContainer.manualLayoutContainer:
        Height: =Health_Header_title_Label.Y + Health_Header_title_Label.Height
        LayoutDirection: =LayoutDirection.Horizontal
        LayoutMode: =LayoutMode.Manual
        Width: =Parent.Width
        ZIndex: =2

        Health_Header_title_Label As label:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =100
            Role: =TextRole.Heading1
            Size: =32
            Text: ="Health"
            Width: =Parent.Width
            X: =0
            ZIndex: =1

        Health_Header_return_IconArrowLeft As icon.ArrowLeft:
            AccessibleLabel: ="Home"
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Height: =100
            Icon: =Icon.ArrowLeft
            OnSelect: =Navigate(HomeScreen_Screen);
            PaddingBottom: =20
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =20
            TabIndex: =0
            Width: =100
            X: =0
            ZIndex: =2

