schema_version: 1
context:
  version: 0.2.2
package:
  name: nwau-py
  version: ${{ version }}
source:
  path: ../..
  use_gitignore: true
  filter:
    exclude:
    - .git/**
    - .venv/**
    - '**/node_modules/**'
    - rust/target/**
    - '**/*.so'
    - '**/*.dylib'
build:
  noarch: python
  number: 0
  script: python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
    - funding-calculator = nwau_py.cli.main:cli
    - mchs-mcp = nwau_py.mcp_server:main
    - mchs-mcp-http = nwau_py.mcp_http_server:main
requirements:
  host:
  - python >=3.15.1,<3.16
  - pip
  - setuptools >=77
  run:
  - python >=3.15.1,<3.16
  - click
  - lightgbm
  - msgpack-python >=1.2.1
  - numpy
  - pandas
  - pyarrow
  - pydantic
  - polars
  - pyreadstat
  - pyxlsb
  - pyyaml >=6.0.3
tests:
- python:
    imports:
    - nwau_py
    pip_check: true
- script:
  - python -c "import sys; assert sys.version_info[:2] == (3, 15)"
  - funding-calculator --help
about:
  homepage: https://github.com/edithatogo/mchs
  summary: IHACPA National Weighted Activity Unit utilities
  license: MIT
  license_file: LICENSE
