name: Power Platform blocker - Power App operation pages are source-UX complete but not live runtime-proven
description: Local issue-generation template for the unresolved Power App runtime-proof blocker.
title: "[Power Platform blocker] Power App operation pages are source-UX complete but not live runtime-proven"
labels:
  - power-platform
  - blocker
  - local-template
body:
  - type: markdown
    attributes:
      value: |
        This template is local only.
        Do not create or claim a live issue from it unless the blocker is still open.

        Blocker id: `power_app_operation_pages_are_source_ux_complete_but_not_live_runtime_proven`
        Source scorecard: `power-platform/repository/repo-health-scorecard.json`
        Supporting evidence:
        - `power-platform/evidence/canvas-app-publication-20260520.json`
        - `power-platform/evidence/deployment-status.json`
  - type: textarea
    id: current_gap
    attributes:
      label: Current gap
      description: Record the runtime proof still missing for the Power App operation pages.
      placeholder: Describe which page, operation flow, or runtime check still lacks live proof.
    validations:
      required: true
  - type: textarea
    id: closure_evidence
    attributes:
      label: Closure evidence
      description: Record the evidence that must be captured before this blocker can be closed.
      placeholder: Include the runtime proof, publication evidence, or operational capture required for closure.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have not claimed production readiness or blocker resolution.
          required: true
        - label: I am using repository evidence, not a live GitHub issue, as the source of truth.
          required: true
