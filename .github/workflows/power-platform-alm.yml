name: Power Platform ALM

on:
  pull_request:
    paths:
      - 'power-platform/**'
      - 'scripts/power-platform-alm.sh'
      - 'scripts/power-platform-alm-lifecycle-gates.sh'
      - 'scripts/validate_power_platform_static.py'
      - 'scripts/validate_power_platform_alm_gates.py'
      - 'scripts/validate_power_platform_repo_health.py'
      - 'scripts/validate_power_platform_sota_capabilities.py'
      - 'scripts/validate_power_platform_operational_evidence.py'
      - 'scripts/validate_power_platform_platform_tests.py'
      - 'scripts/validate_power_platform_github_live_gate.py'
      - 'scripts/validate_power_platform_toolchain.py'
      - 'scripts/validate_power_platform_visual_contract.py'
      - 'scripts/bootstrap-power-platform-github-live-gate.sh'
      - 'scripts/bootstrap-power-platform-github-live-gate.md'
      - 'docs/roadmaps/power-platform-deployment-readiness.md'
      - '.github/workflows/power-platform-alm.yml'
      - '.github/workflows/power-platform-official-actions.yml'
      - '.github/workflows/power-bi-devops.yml'
  push:
    branches: [master]
    paths:
      - 'power-platform/**'
      - 'scripts/power-platform-alm.sh'
      - 'scripts/power-platform-alm-lifecycle-gates.sh'
      - 'scripts/validate_power_platform_static.py'
      - 'scripts/validate_power_platform_alm_gates.py'
      - 'scripts/validate_power_platform_repo_health.py'
      - 'scripts/validate_power_platform_sota_capabilities.py'
      - 'scripts/validate_power_platform_operational_evidence.py'
      - 'scripts/validate_power_platform_platform_tests.py'
      - 'scripts/validate_power_platform_github_live_gate.py'
      - 'scripts/validate_power_platform_toolchain.py'
      - 'scripts/validate_power_platform_visual_contract.py'
      - 'scripts/bootstrap-power-platform-github-live-gate.sh'
      - 'scripts/bootstrap-power-platform-github-live-gate.md'
      - 'docs/roadmaps/power-platform-deployment-readiness.md'
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python scripts/validate_power_platform_static.py
      - run: python scripts/validate_power_platform_alm_gates.py
      - run: python scripts/validate_power_platform_sota_capabilities.py
      - run: python scripts/validate_power_platform_toolchain.py
      - run: python scripts/validate_power_platform_visual_contract.py
      - run: bash -n scripts/power-platform-alm.sh
      - run: bash -n scripts/power-platform-alm-lifecycle-gates.sh

  aggregate-readiness-preflight:
    name: Aggregate readiness preflight (local-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python scripts/validate_power_platform_repo_health.py
      - run: python scripts/validate_power_platform_operational_evidence.py
      - run: python scripts/validate_power_platform_platform_tests.py
      - run: python scripts/validate_power_platform_github_live_gate.py

  pack-check-import-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [pack, check, import]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: bash scripts/power-platform-alm-lifecycle-gates.sh --gate ${{ matrix.gate }}

  deployment-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: nsw-power-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: echo "Deployment is intentionally environment-gated and requires pac auth/secrets."
