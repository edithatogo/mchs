name: Language Registry Live Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  live-registry-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Generate live registry report
        run: |
          set -euo pipefail
          python scripts/language_registry_external_gate_report.py \
            --promotion \
            --live \
            --output language-registry-live.json \
            | tee language-registry-live.txt

      - name: Upload live registry report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: language-registry-live
          path: |
            language-registry-live.json
            language-registry-live.txt
          if-no-files-found: error
