name: Conda recipe

on:
  pull_request:
    paths:
      - conda/recipe/**
      - .github/workflows/conda-recipe.yml
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - conda/recipe/**
      - .github/workflows/conda-recipe.yml
  workflow_dispatch:

concurrency:
  group: conda-recipe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate conda recipe
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Select Python for metadata validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.15.1"
      - name: Validate release tag and package version metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import tomllib

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          expected_version = pyproject["project"]["version"]

          ref_name = os.environ["GITHUB_REF_NAME"]
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          if ref_type == "tag":
              if not ref_name.startswith("v"):
                  raise SystemExit("Release ref must start with v, e.g. v0.2.1")
              tag_version = ref_name.removeprefix("v")
              if tag_version != expected_version:
                  raise SystemExit(
                      f"Tag version {tag_version} does not match pyproject version {expected_version}"
                  )

          recipe_text = Path("conda/recipe/meta.yaml").read_text(encoding="utf-8")
          recipe_match = re.search(r'{%\s*set\s+version\s*=\s*"([^"]+)"\s*%}', recipe_text)
          if not recipe_match:
              raise SystemExit("Could not read conda recipe version from conda/recipe/meta.yaml")
          recipe_version = recipe_match.group(1)
          if recipe_version != expected_version:
              raise SystemExit(
                  f"Conda recipe version {recipe_version} does not match pyproject version {expected_version}"
              )

          modern_text = Path("conda/recipe/recipe.yaml").read_text(encoding="utf-8")
          modern_match = re.search(r"(?m)^  version: ['\"]?([0-9.]+)", modern_text)
          if modern_match is None or modern_match.group(1) != expected_version:
              raise SystemExit("Rattler recipe version does not match pyproject")
          print(f"Release metadata validated for {expected_version}")
          PY

      - name: Install Rust-based packaging tools
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          pixi-version: v0.83.0
          run-install: false
      - name: Render recipe
        run: pixi exec --spec rattler-build=0.77.0 -- rattler-build build --recipe conda/recipe/recipe.yaml --render-only
      - name: Build and test installed package
        run: pixi exec --spec rattler-build=0.77.0 -- rattler-build build --recipe conda/recipe/recipe.yaml --channel conda-forge
