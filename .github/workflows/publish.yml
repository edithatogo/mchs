name: Publish Python package

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and publish
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'push' && github.ref_name || '' }}
      RELEASE_REF_TYPE: ${{ github.event_name == 'release' && 'tag' || github.event_name == 'workflow_dispatch' && github.event.inputs.tag && 'tag' || github.ref_type }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository at tagged ref
        if: github.event_name == 'release'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Check out repository
        if: github.event_name != 'release'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.15.1"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Validate release tag and package version metadata
        env:
          RELEASE_REF_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_REF_TYPE: ${{ github.event_name == 'release' && 'tag' || github.event_name == 'workflow_dispatch' && github.event.inputs.tag && 'tag' || github.ref_type }}
        run: uv run python .github/scripts/validate_release_metadata.py

      - name: Download release artifacts
        if: github.event_name == 'release'
        run: |
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --dir dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact attestations
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz dist/*.zip)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No release artifacts available for attestation verification."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            gh attestation verify "$artifact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${{ github.event.release.tag_name }}" \
              --source-digest "${{ github.sha }}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distribution artifacts
        if: github.event_name != 'release'
        run: uv build

      - name: Generate artifact checksums for manual publish path
        if: github.event_name != 'release'
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz dist/*.zip)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No distributable artifacts found in dist/ for manual publish."
            exit 1
          fi
          sha256sum "${artifacts[@]}" > dist/checksums.txt

      - name: Verify release artifact checksums
        run: |
          rm -f dist/.gitignore dist/default.gitignore
          files_list="${RUNNER_TEMP:-/tmp}/publish-dist-files.txt"
          unexpected_files="${RUNNER_TEMP:-/tmp}/publish-unexpected-files.txt"
          find dist -maxdepth 1 -type f -printf '%f\n' > "${files_list}"
          awk '/^(checksums\.txt|sbom\.cdx\.json|.*\.whl|.*\.tar\.gz|.*\.zip)$/ {next} {print}' "${files_list}" | tee "${unexpected_files}"
          test ! -s "${unexpected_files}" || {
            echo "Unexpected files in dist/ for publish:"
            cat "${unexpected_files}"
            exit 1
          }
          test -f dist/checksums.txt || {
            echo "Missing dist/checksums.txt; cannot verify released artifacts."
            exit 1
          }
          awk '
            NF == 2 || NF == 3 {
              raw_file = $(NF)
              file = raw_file
              sub(/^dist\//, "", file)
              if (file !~ /(\.whl|\.tar\.gz|\.zip|\.json)$/ && file != "checksums.txt") {
                print "Invalid artifact in checksums manifest: " raw_file
                bad = 1
                next
              }
              if (file == "checksums.txt") next
              cmd = "test -f dist/" file
              if (system(cmd) != 0) {
                print "Checksummed file missing: " file
                bad = 1
              }
            }
            END { exit bad }
          ' dist/checksums.txt
          test $? -eq 0 || {
            echo "Invalid checksums manifest entries."
            exit 1
          }
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz dist/*.zip)
          artifact_count=${#artifacts[@]}
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No distributable artifacts found in dist/ after release download/build."
            exit 1
          fi
          checksum_count="$(awk 'NF == 2 || NF == 3 {
            file = $(NF)
            sub(/^dist\//, "", file)
            if (file ~ /(\.whl|\.tar\.gz|\.zip)$/) print file
          }' dist/checksums.txt | sort -u | wc -l | tr -d ' ')"
          for artifact in "${artifacts[@]}"; do
            base="$(basename "${artifact}")"
            if ! awk -v file="${base}" '{
              if (NF == 2 || NF == 3) {
                checksum_file = $(NF)
                sub(/^dist\//, "", checksum_file)
                if (checksum_file == file) found=1
              }
            } END { exit !found }' dist/checksums.txt > /dev/null; then
              echo "Artifact not listed in checksums: ${base}"
              exit 1
            fi
          done
          if [ "${checksum_count}" -ne "${artifact_count}" ]; then
            echo "Mismatch between number of checksummed artifacts (${checksum_count}) and dist artifacts (${artifact_count})."
            exit 1
          fi
          sha256sum --check dist/checksums.txt
          echo "Artifact checksums verified."

      - name: Validate MCP package artifacts
        run: uv run python .github/scripts/validate_mcp_package_artifacts.py

      - name: Bind the exact publication wheel to its frozen runtime lock
        run: bash .github/scripts/generate_release_sbom.sh dist .grype-inputs/runtime.sbom.cdx.json

      - name: Resolve scanned publication source
        id: grype-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Gate PyPI dependencies with Grype
        uses: edithatogo/repository-standards/.github/actions/grype-scan@06a7bd00074b402fe91b2e3ed7a8af806be945e7
        with:
          sbom: .grype-inputs/runtime.sbom.cdx.json
          mode: enforce
          severity-cutoff: critical
          source-sha: ${{ steps.grype-source.outputs.sha }}
          artifact-name: grype-python-publish
          output-directory: .grype-evidence

      - name: Retain publication subject binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grype-python-publish-inputs
          path: .grype-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Verify scanned publication subjects are unchanged
        run: sha256sum --check .grype-inputs/subjects.sha256

      - name: Prepare PyPI upload artifacts
        run: |
          set -euo pipefail
          rm -rf dist-pypi
          mkdir dist-pypi
          cp dist/*.whl dist/*.tar.gz dist-pypi/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-pypi/
