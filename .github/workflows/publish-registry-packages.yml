name: Publish registry packages

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish
        required: true
        type: choice
        default: nuget
        options:
          - cratesio
          - nuget

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-cratesio:
    if: ${{ inputs.registry == 'cratesio' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Publish nwau-core to crates.io
        working-directory: rust/crates/nwau-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if curl -fsSL -A "edithatogo-mchs-publish-workflow" https://crates.io/api/v1/crates/nwau-core/0.1.0 >/dev/null; then
            echo "nwau-core 0.1.0 is already published on crates.io; skipping duplicate publish."
            exit 0
          fi
          cargo publish --locked

  publish-nuget:
    if: ${{ inputs.registry == 'nuget' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Pack Mchs.Bindings.DotNet
        working-directory: bindings/dotnet
        run: dotnet pack DotNetBinding.csproj --configuration Release --output artifacts

      - name: Push Mchs.Bindings.DotNet to NuGet
        working-directory: bindings/dotnet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          nupkg="$(
            find artifacts -maxdepth 1 -type f -name 'Mchs.Bindings.DotNet.*.nupkg' \
              ! -name '*.symbols.nupkg' | sort | tail -n 1
          )"
          dotnet nuget push "$nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
