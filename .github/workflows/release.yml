name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.15.1"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Validate release tag and package version metadata
        run: uv run python .github/scripts/validate_release_metadata.py

      - name: Verify signed tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Verifying tag: ${TAG}"
          if git verify-tag "${TAG}" 2>/dev/null; then
            echo "Tag signature verified successfully"
          else
            echo "WARNING: Tag is not signed. Consider signing tags for GA releases."
          fi

      - name: Build release artifacts
        run: |
          uv build

      - name: Validate MCP package artifacts
        run: uv run python .github/scripts/validate_mcp_package_artifacts.py

      - name: Generate resolved runtime SBOM (CycloneDX)
        run: bash .github/scripts/generate_release_sbom.sh dist dist/sbom.cdx.json

      - name: Gate release dependencies with Grype
        uses: edithatogo/repository-standards/.github/actions/grype-scan@06a7bd00074b402fe91b2e3ed7a8af806be945e7
        with:
          sbom: dist/sbom.cdx.json
          mode: enforce
          severity-cutoff: critical
          artifact-name: grype-python-release
          output-directory: .grype-evidence

      - name: Retain release subject binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grype-python-release-inputs
          path: .grype-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Verify scanned release subjects are unchanged
        run: sha256sum --check .grype-inputs/subjects.sha256

      - name: Generate artifact checksums
        run: |
          set -euo pipefail
          rm -f dist/.gitignore dist/default.gitignore
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz dist/*.zip dist/*.json)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No distributable artifacts found in dist/ to checksum."
            exit 1
          fi
          sha256sum "${artifacts[@]}" > dist/checksums.txt

      - name: Validate distributable filenames
        run: |
          set -euo pipefail
          project_version="$(uv run python - <<'PY'
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz dist/*.zip)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No release artifacts found in dist/."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            if [[ "${artifact}" != *"${project_version}"* ]]; then
              echo "Artifact filename does not include project version ${project_version}: ${artifact}"
              exit 1
            fi
          done
          echo "All distributable artifacts include project version ${project_version}."

      - name: Generate SLSA build attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/*
