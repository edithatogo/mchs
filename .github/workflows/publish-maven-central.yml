name: Publish Maven Central package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run Gradle publish task as dry-run only
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-maven-central:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Validate required Central Portal secrets
        if: ${{ inputs.dry_run == false }}
        env:
          CENTRAL_PORTAL_DEPLOY_URL: ${{ secrets.CENTRAL_PORTAL_DEPLOY_URL }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CENTRAL_PORTAL_DEPLOY_URL CENTRAL_PORTAL_USERNAME CENTRAL_PORTAL_PASSWORD MAVEN_SIGNING_KEY MAVEN_SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build JVM binding
        run: gradle -p bindings/jvm build --console=plain

      - name: Publish JVM binding to Central Portal
        env:
          CENTRAL_PORTAL_DEPLOY_URL: ${{ secrets.CENTRAL_PORTAL_DEPLOY_URL }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          args=(
            -p bindings/jvm
            publishAllPublicationsToCentralPortalRepository
            --console=plain
          )
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(
              -PcentralPortalDeployUrl="$CENTRAL_PORTAL_DEPLOY_URL"
              -PcentralPortalUsername="$CENTRAL_PORTAL_USERNAME"
              -PcentralPortalPassword="$CENTRAL_PORTAL_PASSWORD"
              -PmavenSigningKey="$MAVEN_SIGNING_KEY"
              -PmavenSigningPassword="$MAVEN_SIGNING_PASSWORD"
            )
          fi
          gradle "${args[@]}"
