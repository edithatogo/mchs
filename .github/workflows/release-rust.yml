name: Release (Rust) - Evidence Automation

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. rust-v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build reproducible artefacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      tag: ${{ steps.extract-version.outputs.tag }}
      commit: ${{ steps.extract-version.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Extract and validate tag metadata
        id: extract-version
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}"
          if [[ "${TAG}" != rust-v* ]]; then
            echo "Invalid tag format: ${TAG}. Expected rust-v<semver>"
            exit 1
          fi
          VERSION="${TAG#rust-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          epoch="$(git log -n 1 --pretty=%ct "${TAG}")"
          echo "epoch=${epoch}" >> "$GITHUB_OUTPUT"

      - name: Verify signed tag
        run: |
          TAG="${{ steps.extract-version.outputs.tag }}"
          echo "Verifying signed tag: ${TAG}"
          git verify-tag "${TAG}"

      - name: Verify tag points to release commit
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "${{ steps.extract-version.outputs.tag }}")"
          RELEASE_COMMIT="${{ steps.extract-version.outputs.commit }}"
          if [[ "${TAG_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
            echo "Tag commit mismatch: ${TAG_COMMIT} != ${RELEASE_COMMIT}"
            exit 1
          fi

      - name: Set reproducible build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=${{ steps.extract-version.outputs.epoch }}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C linker-plugin-lto=no" >> "$GITHUB_ENV"

      - name: Create dist directory
        run: mkdir -p ../dist

      - name: Build all crates (release, locked)
        run: cargo build --release --all-features --locked

      - name: Set up Python for SBOM and evidence tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --all --format json --output ../dist/sbom.cdx.json

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Capture Rust coverage summary
        env:
          COVERAGE_SUMMARY_PATH: ../dist/coverage-summary.json
        run: |
          set -euo pipefail
          coverage_json="$(mktemp)"
          cargo llvm-cov \
            --package nwau-core \
            --all-features \
            --workspace \
            --json \
            --output-path "${coverage_json}"
          python3 - "${coverage_json}" "${COVERAGE_SUMMARY_PATH}" <<'PY'
import json
import pathlib
import sys

input_path = pathlib.Path(sys.argv[1])
output_path = pathlib.Path(sys.argv[2])
payload = json.loads(input_path.read_text(encoding="utf-8"))
totals = payload.get("data", [{}])[0].get("totals", {})
coverage = float(totals.get("percent_covered", 0))
output_path.write_text(
    json.dumps({"actual": coverage, "threshold": 90.0}, indent=2) + "\n",
    encoding="utf-8",
)
PY
          coverage="$(python3 - "${COVERAGE_SUMMARY_PATH}" <<'PY'
import json
import sys

summary = json.loads(open(sys.argv[1], encoding="utf-8").read())
print(summary["actual"])
PY
)"
          python3 - "${coverage}" <<'PY'
import sys

coverage = float(sys.argv[1])
if coverage < 90.0:
    raise SystemExit(1)
PY
          echo "Coverage summary: ${coverage}%"

      - name: Collect release artefacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(
            target/release/libnwau_core*
            target/release/libnwau_c_abi*
            target/release/nwau-cli*
            target/wasm32-unknown-unknown/release/*.wasm
          )
          for artifact in "${artifacts[@]}"; do
            base=$(basename "$artifact")
            cp "$artifact" "../dist/${base}"
            echo "Collected: ${base}"
          done
          cp Cargo.lock ../dist/
          cp Cargo.toml ../dist/
          cp ../reference-data/2025/manifest.yaml ../dist/
          cp ../reference-data/2026/manifest.yaml ../dist/

      - name: Generate release evidence bundle
        env:
          TAG: ${{ steps.extract-version.outputs.tag }}
          COMMIT: ${{ steps.extract-version.outputs.commit }}
          VERSION: ${{ steps.extract-version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
import json
import os
import subprocess
from pathlib import Path

tag = os.environ["TAG"]
commit = os.environ["COMMIT"]
version = os.environ["VERSION"]
coverage_path = Path("../dist/coverage-summary.json")
coverage = json.loads(coverage_path.read_text(encoding="utf-8"))

metadata = json.loads(
    subprocess.check_output(
        ["cargo", "metadata", "--no-deps", "--locked", "--format-version", "1"],
        text=True,
    )
)
package_versions = {
    pkg["name"]: pkg["version"]
    for pkg in metadata.get("packages", [])
    if pkg["name"] in {"nwau-core", "nwau-c-abi", "nwau-py"}
}

evidence = {
    "release_id": f"rust-core-{version}",
    "git_commit": commit,
    "git_tag": tag,
    "packages": [f"{name}:{package_versions[name]}" for name in sorted(package_versions)],
    "supported_scope": {
        "runtime": "rust-core",
        "surfaces": [
            "rust-core",
            "c-abi",
            "python-binding",
            "file-contract",
            "cli",
            "http-api",
            "mcp",
        ],
        "streams": ["icu-bed-day"],
        "jurisdictions": ["national", "state", "local", "hwu"],
    },
    "source_manifests": [
        "reference-data/2025/manifest.yaml",
        "reference-data/2026/manifest.yaml",
    ],
    "schema_versions": {
        "canonical": "contracts/canonical/evidence.schema.json",
        "provenance": "contracts/canonical/provenance.schema.json",
        "support_status": "contracts/support/support-status.schema.json",
        "release_evidence": "contracts/release/evidence-bundle.schema.json",
    },
    "fixture_results": [],
    "parity_reports": [],
    "coverage": coverage,
    "sbom": {
        "file": "sbom.cdx.json",
    },
    "security": {
        "cargo_audit": "passed",
        "cargo_deny_advisories": "passed",
        "workflow": "rust_security",
    },
    "provenance": {
        "builder": "github-actions",
        "source_dir": ".",
        "source_commit_timestamp": os.environ.get("SOURCE_DATE_EPOCH", ""),
        "repository": os.environ.get("GITHUB_REPOSITORY", ""),
        "ref": os.environ.get("GITHUB_REF_NAME", ""),
    },
    "known_limitations": [],
    "rollback": {
        "enabled": true,
        "plan": "Disable rust-backed opt-in execution and route through default Python runtime while rerunning parity and release checks.",
    },
}
Path("../dist/release-evidence-bundle.json").write_text(
    json.dumps(evidence, indent=2, sort_keys=True) + "\n",
    encoding="utf-8",
)
print(f"release evidence generated for {tag} @ {commit}")
PY

      - name: Validate release evidence bundle fields
        run: |
          python3 - <<'PY'
import json
from pathlib import Path

schema = json.loads(Path("../contracts/release/evidence-bundle.schema.json").read_text(encoding="utf-8"))
bundle = json.loads(Path("../dist/release-evidence-bundle.json").read_text(encoding="utf-8"))
missing = [field for field in schema["required"] if field not in bundle]
if missing:
    raise SystemExit(f"Release evidence bundle missing required fields: {missing}")
if bundle["coverage"].get("actual", 0) < bundle["coverage"].get("threshold", 0):
    raise SystemExit("Coverage result below threshold in release evidence bundle")
print("Release evidence bundle validated.")
PY

      - name: Generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          artifacts=(*)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No artefacts found to checksum."
            exit 1
          fi
          sha256sum "${artifacts[@]}" > checksums.txt
          cat checksums.txt

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Upload release artefacts
        uses: actions/upload-artifact@v6
        with:
          name: rust-release-artefacts
          path: dist/*

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artefacts
        uses: actions/download-artifact@v6
        with:
          name: rust-release-artefacts
          path: dist

      - name: Generate release notes
        id: release-notes
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          COVERAGE="$(python3 - <<'PY'
import json
print(json.load(open('dist/release-evidence-bundle.json', encoding='utf-8'))['coverage']['actual'])
PY
)"
          RUST_CORE_CRATE_TAG="${{ needs.build.outputs.tag }}"
          cat > dist/RELEASE_NOTES.md <<'EOF'
# Rust Core GA Release Artefacts

## Release
- Tag: ${RUST_CORE_CRATE_TAG}
- Git commit: ${{ needs.build.outputs.commit }}

## Artefacts
- Library artifacts (.so/.dylib/.dll)
- Source and lockfile manifests (for reproducibility)
- SBOM (CycloneDX)
- Coverage summary (JSON)
- Release evidence bundle (`release-evidence-bundle.json`)
- Checksums (SHA-256)

## Release evidence
- Package evidence bundle coverage: ${COVERAGE}%
- Evidence file: `release-evidence-bundle.json`

## Provenance
- Build attestation requested via `actions/attest-build-provenance@v2`.
- Signed tag verification is required before release cut.
EOF

      - name: Assert evidence bundle was released
        run: |
          test -f dist/release-evidence-bundle.json || {
            echo "Missing release-evidence-bundle.json"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "Rust Core ${{ needs.build.outputs.version }}"
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          generate_release_notes: true
