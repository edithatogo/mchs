name: Privacy checks
on: [pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.15.1'
      - uses: astral-sh/setup-uv@v7
      - name: Scan changed text with Presidio
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked --only-group privacy --no-install-project python scripts/privacy_scan.py --revision "$BASE...HEAD"
      - name: Scan submitted commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="$BASE..HEAD" .
