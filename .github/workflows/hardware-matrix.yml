name: Cross-Platform Hardware Acceleration Matrix

on:
  push:
    branches:
      - master
      - 'track/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  matrix-acceleration:
    name: Hardware Matrix (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python 3.15.1
        run: uv python install 3.15.1

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Run 128-bit cross-platform numerical invariant verification
        run: |
          cd rust
          cargo test -p nwau-core --test hardware_acceleration -- test_128bit_deterministic_invariants_across_architectures --nocapture

      - name: Run parallel 100k episode throughput and bootstrap verification
        run: |
          cd rust
          cargo test -p nwau-core --test hardware_acceleration -- --nocapture

      - name: Build Python extension with maturin
        run: |
          uv run --with maturin maturin develop --release --manifest-path rust/crates/nwau-py/Cargo.toml

      - name: Run Python hardware acceleration test suite
        run: |
          uv run pytest tests/test_hardware_acceleration.py -v
